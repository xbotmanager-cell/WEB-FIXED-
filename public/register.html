<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account - kings</title>
    <script defer src="/assets/js/auth.js"></script>
  <!-- Font Awesome CDN for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <img src="/assets/images/de-king-logo.svg" alt="kings Logo" class="logo2">
  </header>

  <main class="container">
    <!-- Hero Section -->
    <section class="hero">
      <img id="heroImage" src="/assets/images/pic2.jpg" alt="Happy people outdoors" class="hero-image">
    </section>

    <!-- Form Section -->
    <section class="form-section">
      <h1>Create an account</h1>
      <nav class="tabs">
        <button class="tab active" data-target="personalForm">Personal</button>
        <button class="tab" data-target="businessForm">Business</button>
      </nav>

      <!-- Personal Form -->
      <form id="personalForm" class="form" action="/register/personal" method="POST">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" name="firstName" required>

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" name="lastName" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <div class="checkbox">
          <input type="checkbox" id="staySignedIn" name="staySignedIn">
          <label for="staySignedIn">Stay signed in</label>
        </div>

        <button type="submit" class="btn-primary">Create personal account</button>

        <!-- Social Login with Icons -->
        <div class="social-login">
          <p>Or continue with:</p>
          <button type="button" id="googleLogin" class="btn-google">
            <i class="fa-brands fa-google" style="color: rgb(177, 151, 252);"></i> Google
          </button>
          <button type="button" id="appleLogin" class="btn-apple">
            <i class="fa-brands fa-apple" style="color: rgb(2, 5, 10);"></i> Apple
          </button>
          <button type="button" id="facebookLogin" class="btn-facebook">
            <i class="fa-brands fa-facebook" style="color: rgb(116, 192, 252);"></i> Facebook
          </button>
        </div>
      </form>

      <!-- Business Form -->
      <form id="businessForm" class="form hidden" action="/register/business" method="POST">
        <label for="businessName">Business name</label>
        <input type="text" id="businessName" name="businessName" required>

        <label for="businessEmail">Business email</label>
        <input type="email" id="businessEmail" name="businessEmail" required>

        <label for="passwordBusiness">Password</label>
        <input type="password" id="passwordBusiness" name="password" minlength="8" required>

        <label for="country">Where is your business registered?</label>
        <select id="country" name="country" required>
          <option value="">Select country</option>
          <option value="US">United States</option>
          <option value="UK">United Kingdom</option>
          <option value="DE">Germany</option>
          <option value="CN">China</option>
          <!-- More countries -->
        </select>

        <button type="submit" class="btn-primary">Create business account</button>
      </form>
    </section>
  </main>
  

<style>
/* Reset & Base */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color: #222;
  background-color: #f9f9f9;
}

/* Header */
.header {
  padding: 1rem 2rem;
  background: #fff;
  border-bottom: 1px solid #ddd;
}

.logo2 {
  height: 135px;
  width: auto;
}
.logo {
  height: 40px;
}

/* Layout */
.container {
  display: flex;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 2rem auto;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.hero {
  flex: 1 1 50%;
  min-height: 400px;
}

.hero-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Form Section */
.form-section {
  flex: 1 1 50%;
  padding: 2rem;
}

.form-section h1 {
  font-size: 1.8rem;
  margin-bottom: 1rem;
}

/* Tabs */
.tabs {
  display: flex;
  margin-bottom: 1.5rem;
  border: 1px solid #ddd;
  border-radius: 20px;
}

.tab {
  flex: 1;
  padding: 0.75rem;
  border: 1px solid #ddd;
  background: #f1f1f1;
  cursor: pointer;
  text-align: center;
  font-weight: bold;
  border-radius: 20px;
}

.tab.active {
  background: #fff;
  border-bottom: 2px solid #0064d2;
  color: #0064d2;
}

/* Form */
.form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.form label {
  font-weight: 600;
  margin-bottom: 0.25rem;
}

.form input,
.form select {
  padding: 0.75rem;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.form input:focus,
.form select:focus {
  border-color: #0064d2;
  outline: none;
}

/* Checkbox */
.checkbox {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Buttons */
.btn-primary {
  background: #0064d2;
  color: #fff;
  padding: 0.75rem;
  border: none;
  border-radius: 20px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s ease;
}

.btn-primary:hover {
  background: #004a9f;
}

/* Social Login */
.social-login {
  margin-top: 1.5rem;
  text-align: center;
}

.social-login p {
  margin-bottom: 0.75rem;
}

.social-login button {
  margin: 0.25rem;
  padding: 0.75rem 1rem;
  border: 1px solid #ccc;
  border-radius: 35px;
  cursor: pointer;
  font-weight: bold;
}

.btn-google { background: #fff; color: #ddd; }
.btn-apple { background: #fff; color: #ddd; }
.btn-facebook { background: #fff; color: #ddd; }

.btn-google:hover { background: #fff; }
.btn-apple:hover { background: #fff; }
.btn-facebook:hover { background: #fff; }

/* Footer */
.footer {
  padding: 1rem 2rem;
  background: #fff;
  border-top: 1px solid #ddd;
  text-align: center;
}

.footer nav {
  margin-bottom: 0.5rem;
}

.footer nav a {
  margin: 0 0.5rem;
  color: #0064d2;
  text-decoration: none;
}

.footer nav a:hover {
  text-decoration: underline;
}

.footer p {
  font-size: 0.875rem;
  color: #666;
}

/* Responsive */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .hero {
    min-height: 200px;
  }
}
.hidden {
  display: none;
}
/* Base icon styling */
.social-login i {
  font-size: 2rem;
  margin: 0 0.75rem;
  cursor: pointer;
  transition: transform 0.3s ease, color 0.3s ease;
  display: inline-block;
}

/* Hover animation */
.social-login i:hover {
  transform: scale(1.2) rotate(10deg);
  filter: brightness(1.2);
}

/* Entry bounce animation */
@keyframes bounceIn {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(1); }
}

.social-login i {
  animation: bounceIn 0.6s ease forwards;
}

/* Staggered delays for each icon */
.social-login i:nth-child(2) { animation-delay: 0.2s; }
.social-login i:nth-child(3) { animation-delay: 0.4s; }
.social-login i:nth-child(4) { animation-delay: 0.6s; }

/* Click pulse animation */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.social-login i:active {
  animation: pulse 0.3s ease;
}

</style>





<footer class="footer">
    <nav>
      <a href="#">Accessibility</a>
      <a href="#">User Agreement</a>
      <a href="#">Privacy</a>
      <a href="#">Cookies</a>
      <a href="#">CA Privacy Notice</a>
    </nav>
    <p>&copy; 1995–2026 eBay Inc. All Rights Reserved.</p>
  </footer>

</body>
</html>
